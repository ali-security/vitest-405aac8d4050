name: Publish Package

# Triggers narrowed to workflow_dispatch on the seal fork: publishing needs an npm
# token we do not have, and the tag push from a fork sync must not trigger it.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  VITEST_GENERATE_UI_TOKEN: 'true'
  VITE_TEST_WATCHER_DEBUG: 'false'

jobs:
  publish:
    timeout-minutes: 30
    if: github.repository == 'vitest-dev/vitest'
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Set node version to 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: pnpm run publish-ci ${{ github.ref_name }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate Changelog
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
