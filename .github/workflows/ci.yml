name: CI

# Remove default permissions of GITHUB_TOKEN for security
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions: {}

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
  VITEST_GENERATE_UI_TOKEN: 'true'

jobs:
  lint:
    # Static-analysis gate only (eslint / tsc --noEmit / actionlint / stale-artifact
    # diff). It executes none of the shipped code, so it is disabled on the fork.
    if: false
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: 'Lint: node-latest, ubuntu-latest'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-and-cache

      - name: Install
        run: pnpm i

      - name: Build
        run: pnpm run build

      # check uncommited LICENSE.md, auto-imports.d.ts, etc...
      - name: Check stale build artifacts
        run: git diff --exit-code

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # From https://github.com/rhysd/actionlint/blob/main/docs/usage.md#use-actionlint-on-github-actions
      - name: Check workflow files
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color -shellcheck=""

  # The upstream `changed` job (tj-actions/changed-files) only decides whether the
  # test jobs may be skipped for docs-only diffs. On a workflow_dispatch of the
  # fork there is no pull-request diff for it to read, so it is removed together
  # with the `needs:`/`if:` gates it fed — the test jobs always run here.

  test:
    name: 'Build&Test: node-${{ matrix.node_version }}, ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    strategy:
      matrix:
        os: [ubuntu-latest]
        # The `20` legs are pinned to 20.19.2 - the Node 20 that packed the
        # published 3.2.4 tarball. setup-node's floating `20` now resolves to
        # 20.20.2, whose Windows build aborts (SIGABRT, `Assertion failed:
        # (req_wrap_async) != nullptr` in node::fs::Access) while the test-core
        # suite tears down an async fs.access, killing the whole leg.
        node_version: [18, 20.19.2, 22, 24]
        include:
          - os: macos-latest
            node_version: 20.19.2
          - os: windows-latest
            node_version: 20.19.2
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-and-cache
        with:
          node-version: ${{ matrix.node_version }}

      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3

      - name: Install
        run: pnpm i

      - name: Install Playwright Dependencies
        run: pnpm exec playwright install chromium --with-deps --only-shell

      - name: Build
        run: pnpm run build

      # Release packaging. Upstream packs and publishes from publish.yml
      # (`pnpm -r publish`, which needs an npm token), so the equivalent pack is
      # done here on the leg whose runtime matches the published tarball
      # (node 20, linux). `pnpm pack` is used rather than `npm pack` because it is
      # what publish.yml uses and it resolves the `workspace:*` dependency ranges
      # to real versions the way the published package.json has them.
      - name: Pack @vitest/mocker
        if: matrix.os == 'ubuntu-latest' && matrix.node_version == '20.19.2'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/seal-artifacts"
          cd packages/mocker
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/seal-artifacts"
          cd "$GITHUB_WORKSPACE"
          mv "$GITHUB_WORKSPACE/seal-artifacts/vitest-mocker-3.2.4.tgz" "$GITHUB_WORKSPACE/seal-artifacts/mocker-3.2.4.tgz"
          ls -l "$GITHUB_WORKSPACE/seal-artifacts"

      - name: Test
        run: pnpm run test:ci

      - name: Test Examples
        run: pnpm run test:examples

      - name: Unit Test UI
        run: pnpm run -C packages/ui test:ui

      - name: Upload @vitest/mocker tarball
        if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.node_version == '20.19.2' }}
        uses: actions/upload-artifact@v4
        with:
          name: mocker-tarball
          path: seal-artifacts/mocker-3.2.4.tgz
          if-no-files-found: error

  test-browser:
    name: 'Browsers: node-20, ${{ matrix.os }}'

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
      fail-fast: false

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-and-cache
        with:
          # Pinned to the release-era Node 20 for the same reason as the test
          # job's matrix above: floating `20` now resolves to 20.20.2, which
          # aborts on Windows inside node::fs::Access.
          node-version: 20.19.2

      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3
      - uses: browser-actions/setup-firefox@634a60ccd6599686158cf5a570481b4cd30455a2 # v1.5.4

      - name: Install
        run: pnpm i

      - name: Install Playwright Dependencies
        run: pnpm exec playwright install --with-deps --only-shell

      - name: Build
        run: pnpm run build

      - name: Test Browser (playwright)
        run: pnpm run test:browser:playwright

      - name: Test Browser (webdriverio)
        run: pnpm run test:browser:webdriverio

  test-rolldown:
    # macos-latest is the fastes one
    name: 'Rolldown&Test: node-20, macos-latest'
    # Disabled on the fork: this job re-resolves `vite@npm:rolldown-vite` from the
    # registry with --no-frozen-lockfile, so it always pulls TODAY's experimental
    # rolldown build rather than the one that existed at the 3.2.4 release, and it
    # needs a git identity for its `git commit` step. It runs the same
    # `test:ci`/`test:examples` suites as the `test` job (only the bundler differs),
    # so disabling it removes no test coverage.
    if: false
    runs-on: macos-latest

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-and-cache
        with:
          node-version: 20

      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3

      - name: Install
        run: pnpm add vite@npm:rolldown-vite && git add . && git commit -m "ci" && pnpm i --prefer-offline --no-frozen-lockfile

      - name: Install Playwright Dependencies
        run: pnpm exec playwright install --with-deps --only-shell

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:ci

      - name: Test Examples
        run: pnpm run test:examples

      - name: Test Browser (playwright)
        run: pnpm run test:browser:playwright
